<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/strawHat-fav.webp" type="image/webp" />
    <title>Monkey D. Luffy - Pirate Portfolio Template</title>
    <script>
      // IIFE to avoid polluting global scope
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            // Default to light if theme is 'light' or not set
            document.documentElement.classList.remove("dark");
            if (!theme) {
              // If no theme was stored, set it to 'light'
              localStorage.setItem("theme", "light");
            }
          }
        } catch (e) {
          // Fallback for environments where localStorage might be restricted
          console.warn("Could not set initial theme from localStorage:", e);
          document.documentElement.classList.remove("dark"); // Default to light on error
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class", // Enable class-based dark mode
        theme: {
          extend: {
            colors: {
              // Light theme (default) based on user's new palette
              background: "#FFFFFF", // --color-bg
              card: "#F7F7F7", // --color-surface
              "card-hover": "#ECECEC", // Derived: slightly darker than card
              border: "#E5E5EA", // --color-divider
              "input-bg": "#F2F2F5", // --color-input-bg
              "input-border": "#E5E5EA", // Use divider color for input border for consistency
              "text-primary": "#1C1C1E", // --color-text-primary
              "text-secondary": "rgba(60,60,67,0.6)", // --color-text-secondary
              "text-placeholder": "#9E9EA0", // --color-placeholder

              "button-primary-bg": "#000000", // --color-button-primary-bg
              "button-primary-text": "#FFFFFF", // --color-button-primary-text
              "button-primary-hover": "#1A1A1A", // Derived: slightly lighter black

              "button-secondary-bg": "#E5E5EA", // Using --color-divider as base
              "button-secondary-text": "#1C1C1E", // Using --color-text-primary
              "button-secondary-hover": "#DCDCE0", // Derived: slightly darker

              "accent-green": "#34C759", // --color-accent (light)
              "accent-green-bg": "#E6F9EC", // --color-accent-bg (light)
              "accent-red": "#FF3B30", // System Red (Light)

              // Dark theme based on user's new palette
              "dark-background": "#1C1C1E", // --color-bg
              "dark-card": "#2C2C2E", // --color-surface
              "dark-card-hover": "#38383A", // Derived: slightly lighter than dark-card
              "dark-border": "#3A3A3C", // --color-divider
              "dark-input-bg": "#3A3A3C", // --color-input-bg
              "dark-input-border": "#4A4A4C", // Derived: slightly lighter than input-bg for border
              "dark-text-primary": "#FFFFFF", // --color-text-primary
              "dark-text-secondary": "rgba(235,235,245,0.6)", // --color-text-secondary
              "dark-text-placeholder": "#636366", // --color-placeholder

              "dark-button-primary-bg": "#48484A", // --color-button-primary-bg
              "dark-button-primary-text": "#FFFFFF", // --color-button-primary-text
              "dark-button-primary-hover": "#5A5A5C", // Derived: slightly lighter

              "dark-button-secondary-bg": "#3A3A3C", // Using --color-divider/--color-input-bg (dark)
              "dark-button-secondary-text": "#FFFFFF", // Using --color-text-primary (dark)
              "dark-button-secondary-hover": "#4A4A4C", // Derived: slightly lighter

              "dark-accent-green": "#30D158", // --color-accent (dark)
              "dark-accent-green-bg": "#054F27", // --color-accent-bg (dark)
              "dark-accent-red": "#FF453A", // System Red (Dark)
            },
            ringColor: (theme) => ({
              // For focus rings
              DEFAULT: theme("colors.accent-green"), // Use light accent green for default focus ring
              // Dark mode focus rings will be handled by dark:ring-dark-accent-green or similar specific classes
            }),
            animation: {
              // Add custom animation
              "spin-slow": "spin-slow 20s linear infinite",
            },
            keyframes: {
              // Add custom keyframes
              "spin-slow": {
                to: { transform: "rotate(360deg)" },
              },
            },
            letterSpacing: {
              // Extend letterSpacing
              wider: "0.9em", // Override default 'wider'
            },
          },
        },
      };
    </script>
    <style>
      html.lenis,
      html.lenis body {
        height: auto;
      }
      .lenis.lenis-smooth {
        scroll-behavior: auto !important;
      }
      .lenis.lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      .lenis.lenis-stopped {
        overflow: hidden;
      }

      .page-transition {
        transition: opacity 0.3s ease-in-out;
      }
      .page-fade-enter {
        opacity: 0;
      }
      .page-fade-enter-active {
        opacity: 1;
      }
      .page-fade-exit {
        opacity: 1;
      }
      .page-fade-exit-active {
        opacity: 0;
      }
      /* Ensure html/body take full height for sticky footer */
      html,
      body,
      #root {
        min-height: 100vh;
      }
      #root {
        display: flex;
        flex-direction: column;
      }

      /* Header nav active pill */
      :root {
        --current-accent-color-text: #34c759; /* For active icon text (light) */
        --current-accent-pill-bg: #ececec; /* For pill background (light theme card-hover) */
      }
      html.dark {
        /* More specific selector for when <html> has 'dark' class */
        --current-accent-color-text: #30d158; /* For active icon text (dark) */
        --current-accent-pill-bg: #38383a; /* For pill background (dark theme dark-card-hover) */
      }
      .nav-active-pill {
        position: absolute;
        background-color: var(--current-accent-pill-bg);
        border-radius: 9999px; /* Pill shape */
        transition:
          left 0.3s ease-in-out,
          width 0.3s ease-in-out,
          top 0.3s ease-in-out,
          height 0.3s ease-in-out,
          opacity 0.3s ease-in-out,
          background-color 0.3s ease-in-out; /* Added background-color transition */
        opacity: 0;
        z-index: -1; /* Ensure it's behind the icon/text content of NavItem */
      }

      /* Global transitions for theme changes */
      *,
      *::before,
      *::after {
        transition-property:
          background-color, border-color, color, fill, stroke;
        transition-duration: 0.3s;
        transition-timing-function: ease-in-out;
      }

      /* Ensure .page-transition and .nav-active-pill specific transitions are respected. */
      /* The transition shorthand on these classes will correctly override the global * transition-property for them. */
      /* For .page-transition, it will only transition opacity. */
      /* For .nav-active-pill, it will transition its listed properties (left, width, etc., and now background-color). */

      /* Theme toggle: smooth top→bottom reveal */
      @media (prefers-reduced-motion: no-preference) {
        ::view-transition-old(root),
        ::view-transition-new(root) {
          mix-blend-mode: normal;
          animation-duration: 500ms;
          animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }

        ::view-transition-old(root) {
          z-index: 1;
          animation-name: theme-fade-out;
        }

        ::view-transition-new(root) {
          z-index: 2;
          animation-name: theme-wipe-down;
        }

        @keyframes theme-wipe-down {
          from {
            clip-path: inset(0 0 100% 0);
          }
          to {
            clip-path: inset(0 0 0 0);
          }
        }

        @keyframes theme-fade-out {
          from {
            opacity: 1;
          }
          to {
            opacity: 0;
          }
        }
      }

      @media (prefers-reduced-motion: reduce) {
        ::view-transition-old(root),
        ::view-transition-new(root) {
          animation: none !important;
        }
      }

      /* Intro Animation Styles */
      @keyframes intro-letter-anim {
        from {
          opacity: 0;
          transform: translateY(50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes intro-line-anim {
        from {
          width: 0%;
          left: 50%;
          transform: translateX(-50%);
        }
        to {
          width: 100%;
          left: 0%;
          transform: translateX(0%);
        }
      }

      .intro-letter {
        opacity: 0; /* Initial state */
        animation: intro-letter-anim 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .intro-line {
        animation: intro-line-anim 0.8s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        animation-delay: 0.5s;
      }

      @keyframes intro-float {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(18px, -14px, 0) scale(1.03);
        }
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes intro-float-reverse {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(-16px, 12px, 0) scale(1.02);
        }
        100% {
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes intro-text-pan {
        0% {
          background-position: 0 0;
        }
        100% {
          background-position: 420px 420px;
        }
      }

      .intro-bg-grid {
        opacity: 0.5;
        background-image:
          linear-gradient(
            to right,
            rgba(60, 60, 67, 0.08) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(60, 60, 67, 0.08) 1px,
            transparent 1px
          );
        background-size: 56px 56px;
        mask-image: radial-gradient(
          circle at 50% 45%,
          rgba(0, 0, 0, 0.9) 0%,
          rgba(0, 0, 0, 0.25) 55%,
          transparent 72%
        );
      }
      .dark .intro-bg-grid {
        opacity: 0.35;
        background-image:
          linear-gradient(
            to right,
            rgba(235, 235, 245, 0.08) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(235, 235, 245, 0.08) 1px,
            transparent 1px
          );
      }

      .intro-blob {
        border-radius: 9999px;
        filter: blur(42px);
        opacity: 0.42;
        background:
          radial-gradient(
            circle at 30% 30%,
            rgba(52, 199, 89, 0.65),
            transparent 62%
          ),
          radial-gradient(
            circle at 70% 70%,
            rgba(0, 0, 0, 0.22),
            transparent 58%
          );
        animation: intro-float 4.8s ease-in-out infinite;
      }
      .dark .intro-blob {
        opacity: 0.35;
        background:
          radial-gradient(
            circle at 30% 30%,
            rgba(48, 209, 88, 0.55),
            transparent 62%
          ),
          radial-gradient(
            circle at 70% 70%,
            rgba(255, 255, 255, 0.12),
            transparent 58%
          );
      }
      .intro-blob--right {
        animation: intro-float-reverse 5.6s ease-in-out infinite;
      }

      .intro-diagonal-text {
        opacity: 0.18;
        background-image: repeating-linear-gradient(
          135deg,
          rgba(60, 60, 67, 0.18) 0px,
          rgba(60, 60, 67, 0.18) 1px,
          transparent 1px,
          transparent 18px
        );
        mask-image: radial-gradient(
          circle at 55% 45%,
          rgba(0, 0, 0, 0.7) 0%,
          transparent 70%
        );
      }
      .dark .intro-diagonal-text {
        opacity: 0.12;
        background-image: repeating-linear-gradient(
          135deg,
          rgba(235, 235, 245, 0.22) 0px,
          rgba(235, 235, 245, 0.22) 1px,
          transparent 1px,
          transparent 18px
        );
      }

      .intro-tagline {
        opacity: 0;
        animation: fadeIn 0.7s ease-out forwards;
        animation-delay: 0.9s;
      }

      /* Mobile polish for intro background */
      @media (max-width: 640px) {
        .intro-bg-grid {
          opacity: 0.32;
          background-size: 44px 44px;
        }
        .dark .intro-bg-grid {
          opacity: 0.24;
        }
        .intro-blob {
          filter: blur(36px);
          opacity: 0.32;
        }
        .dark .intro-blob {
          opacity: 0.26;
        }
        .intro-diagonal-text {
          opacity: 0.1;
        }
        .dark .intro-diagonal-text {
          opacity: 0.08;
        }
      }

      /* Page Load Animations */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Custom spin animation (if not using Tailwind's extended animation) */
      @keyframes spin-slow-custom {
        to {
          transform: rotate(360deg);
        }
      }
      .animate-spin-slow-custom {
        /* Use if Tailwind extend doesn't work as expected */
        animation: spin-slow-custom 20s linear infinite;
      }

      .animated-item {
        opacity: 0; /* Initial state, animation will override */
      }

      .anim-fadeInUp {
        animation: fadeInUp 0.5s ease-out forwards;
      }

      .anim-fadeIn {
        animation: fadeIn 0.4s ease-out forwards;
      }

      /* Animation Delay Utilities */
      .anim-delay-100 {
        animation-delay: 0.1s;
      }
      .anim-delay-200 {
        animation-delay: 0.2s;
      }
      .anim-delay-300 {
        animation-delay: 0.3s;
      }
      .anim-delay-400 {
        animation-delay: 0.4s;
      }
      .anim-delay-500 {
        animation-delay: 0.5s;
      }
      .anim-delay-600 {
        animation-delay: 0.6s;
      }
      .anim-delay-700 {
        animation-delay: 0.7s;
      }

      /* About page profile image: clean glitch (no base shake) */
      .about-profile-glitch-wrap {
        position: relative;
        overflow: hidden;
        border-radius: 0.5rem; /* keep rounded even with overflow hidden */
        background: transparent;
        cursor: pointer;
        --mx: 50%;
        --my: 50%;
      }
      .about-profile-glitch-base {
        display: block;
      }
      /* Black & white only under cursor (masked layer) */
      .about-profile-glitch-bw {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        filter: grayscale(1) contrast(1.08);
        will-change:
          opacity,
          -webkit-mask-image,
          mask-image;
        -webkit-mask-image: radial-gradient(
          circle 200px at var(--mx) var(--my),
          rgba(0, 0, 0, 0.9) 0%,
          rgba(0, 0, 0, 0.65) 38%,
          rgba(0, 0, 0, 0.28) 62%,
          rgba(0, 0, 0, 0) 85%
        );
        mask-image: radial-gradient(
          circle 200px at var(--mx) var(--my),
          rgba(0, 0, 0, 0.9) 0%,
          rgba(0, 0, 0, 0.65) 38%,
          rgba(0, 0, 0, 0.28) 62%,
          rgba(0, 0, 0, 0) 85%
        );
      }
      .about-profile-glitch-wrap:hover .about-profile-glitch-bw,
      .about-profile-glitch-wrap.is-glitching .about-profile-glitch-bw {
        opacity: 1;
        transition: opacity 140ms ease;
      }
      .about-profile-glitch-layer {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        will-change: opacity, clip-path, filter, transform;
      }

      @keyframes glitch-hover-a {
        0%,
        100% {
          opacity: 0;
          clip-path: inset(0 0 100% 0);
          filter: none;
          transform: translate3d(0, 0, 0);
        }
        25% {
          opacity: 0.14;
          clip-path: inset(18% 0 76% 0);
          filter: hue-rotate(95deg) saturate(1.15);
          transform: translate3d(1px, 0, 0);
        }
        55% {
          opacity: 0.1;
          clip-path: inset(62% 0 30% 0);
          filter: hue-rotate(115deg) saturate(1.18);
          transform: translate3d(-1px, 0, 0);
        }
      }

      @keyframes glitch-hover-b {
        0%,
        100% {
          opacity: 0;
          clip-path: inset(0 0 100% 0);
          filter: none;
          transform: translate3d(0, 0, 0);
        }
        35% {
          opacity: 0.12;
          clip-path: inset(34% 0 56% 0);
          filter: hue-rotate(-18deg) saturate(1.2) contrast(1.05);
          transform: translate3d(-1.5px, 0, 0);
        }
        70% {
          opacity: 0.08;
          clip-path: inset(72% 0 20% 0);
          filter: hue-rotate(-8deg) saturate(1.16);
          transform: translate3d(1.5px, 0, 0);
        }
      }

      /* Hover interaction: clean, subtle shimmer */
      .about-profile-glitch-wrap:hover .about-profile-glitch-layer--a {
        animation: glitch-hover-a 900ms ease-in-out both;
      }
      .about-profile-glitch-wrap:hover .about-profile-glitch-layer--b {
        animation: glitch-hover-b 900ms ease-in-out both;
      }

      /* Click/tap interaction: short burst */
      @keyframes glitch-burst-a {
        0% {
          opacity: 0;
          clip-path: inset(0 0 100% 0);
          filter: none;
          transform: translate3d(0, 0, 0);
        }
        20% {
          opacity: 0.32;
          clip-path: inset(10% 0 78% 0);
          filter: hue-rotate(110deg) saturate(1.35);
          transform: translate3d(2px, 0, 0);
        }
        45% {
          opacity: 0.26;
          clip-path: inset(52% 0 38% 0);
          filter: hue-rotate(135deg) saturate(1.4) contrast(1.06);
          transform: translate3d(-2px, 0, 0);
        }
        70% {
          opacity: 0.18;
          clip-path: inset(76% 0 18% 0);
          filter: hue-rotate(95deg) saturate(1.3);
          transform: translate3d(1px, 0, 0);
        }
        100% {
          opacity: 0;
          clip-path: inset(0 0 100% 0);
          filter: none;
          transform: translate3d(0, 0, 0);
        }
      }
      @keyframes glitch-burst-b {
        0% {
          opacity: 0;
          clip-path: inset(0 0 100% 0);
          filter: none;
          transform: translate3d(0, 0, 0);
        }
        30% {
          opacity: 0.24;
          clip-path: inset(28% 0 60% 0);
          filter: hue-rotate(-22deg) saturate(1.35) contrast(1.08);
          transform: translate3d(-3px, 0, 0);
        }
        55% {
          opacity: 0.18;
          clip-path: inset(66% 0 26% 0);
          filter: hue-rotate(-10deg) saturate(1.25);
          transform: translate3d(3px, 0, 0);
        }
        100% {
          opacity: 0;
          clip-path: inset(0 0 100% 0);
          filter: none;
          transform: translate3d(0, 0, 0);
        }
      }
      .about-profile-glitch-wrap.is-glitching .about-profile-glitch-layer--a {
        animation: glitch-burst-a 420ms ease-out both;
      }
      .about-profile-glitch-wrap.is-glitching .about-profile-glitch-layer--b {
        animation: glitch-burst-b 420ms ease-out both;
      }

      @media (prefers-reduced-motion: reduce) {
        .about-profile-glitch-layer {
          animation: none !important;
          filter: none !important;
          transform: none !important;
          opacity: 0 !important;
        }
        .about-profile-glitch-bw {
          opacity: 0 !important;
          -webkit-mask-image: none !important;
          mask-image: none !important;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@^19.1.0",
          "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
          "react/": "https://esm.sh/react@^19.1.0/",
          "react-icons/": "https://esm.sh/react-icons@5.2.1/"
        }
      }
    </script>
    <!-- optional local stylesheet hook (safe if missing) -->
    <!-- <link rel="stylesheet" href="/index.css" /> -->
  </head>
  <body
    class="bg-background dark:bg-dark-background text-text-primary dark:text-dark-text-primary"
  >
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
